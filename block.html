<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>مدیر بلوک | آپارتمان پلاس</title>
  <link rel="stylesheet" href="css/style.css?v=999">
  <link rel="stylesheet" href="css/auth.css?v=1">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#5b4cdb">
  <link rel="icon" href="assets/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="مدیر ساختمان">
  <meta name="robots" content="noindex">
</head>
<body>

  <div class="login-page">
    <div class="login-box">

      <div class="login-brand">
        <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg" fill="none">
          <rect width="512" height="512" rx="110" fill="#5b4cdb"/>
          <path d="M370 380H142V200c0-8 5-15 12-17l140-33c6-1 12 0 17 3s8 9 8 15v212zM392 165c0-6 4-12 9-15s12-4 18-2l48 11c8 2 13 9 13 17v204h-88V165zM320 80c0-7 5-12 12-12h72c7 0 12 5 12 12v64h-96V80z"
                fill="#ffffff"/>
          <rect x="238" y="300" width="24" height="80" rx="12" fill="#5b4cdb"/>
        </svg>
        <h1>آپارتمان پلاس</h1>
        <p>🧩 پنل مدیر بلوک</p>
      </div>

      <!-- تب‌ها -->
      <div class="login-tabs">
        <button class="login-tab active" data-block-tab="login">🔑 ورود مدیر بلوک</button>
        <button class="login-tab" data-block-tab="register">✨ ثبت‌نام مدیر بلوک</button>
      </div>

      <div class="auth-status" id="blockStatus" role="status" aria-live="polite"></div>

      <!-- تب ورود -->
      <div class="login-tab-content active" data-block-tab-content="login">
        <div class="form-group">
          <label for="blockLoginCode">🏢 کد ساختمان</label>
          <input type="text" id="blockLoginCode" class="form-input" placeholder="مثلاً M-123456" dir="ltr" autocomplete="organization" autocapitalize="characters" />
        </div>
        <div class="form-group">
          <label for="blockLoginPhone">📱 شماره موبایل</label>
          <input type="tel" id="blockLoginPhone" class="form-input" placeholder="۰۹۱۲۱۲۳۴۵۶۷" maxlength="11" dir="ltr" autocomplete="username" inputmode="numeric" />
        </div>
        <div class="form-group">
          <label for="blockLoginPassword">🔒 رمز عبور</label>
          <div class="show-pass-wrapper">
            <input type="password" id="blockLoginPassword" class="form-input" placeholder="••••••••" style="padding-left: 40px;" autocomplete="current-password" />
            <button type="button" class="show-pass-btn" data-toggle-pass="blockLoginPassword">👁️</button>
          </div>
        </div>
        <div class="login-error-msg" id="blockLoginError" style="margin:-4px 0 8px;"></div>
        <button class="login-submit-btn" id="btnBlockLoginSubmit">🚀 ورود به پنل بلوک</button>
        <p class="login-footer-text">
          هنوز حساب مدیر بلوک ندارید؟
          <a data-goto-block-tab="register">ثبت‌نام کنید</a>
        </p>
      </div>

      <!-- تب ثبت‌نام -->
      <div class="login-tab-content" data-block-tab-content="register">
        <p class="form-hint" style="margin:-6px 0 14px;font-size:12.5px;color:#64748b;">درخواست شما برای مدیر ساختمان فرستاده می‌شود و بعد از تأیید او می‌توانید وارد شوید.</p>
        <div class="form-group">
          <label for="blockRegCode">🏢 کد ساختمان</label>
          <input type="text" id="blockRegCode" class="form-input" placeholder="کد را از مدیر ساختمان بگیرید" dir="ltr" autocapitalize="characters" autocomplete="off" />
          <div class="form-hint" id="blockRegCodeHint"></div>
        </div>
        <div class="form-group">
          <label for="blockRegBlock">🧱 بلوک</label>
          <select id="blockRegBlock" class="form-input" disabled>
            <option value="">اول کد ساختمان را وارد کنید</option>
          </select>
          <input type="text" id="blockRegBlockText" class="form-input" placeholder="نام بلوک (مثلاً A)" style="display:none;" autocomplete="off" />
        </div>
        <div class="form-group">
          <label for="blockRegName">👤 نام و نام خانوادگی</label>
          <input type="text" id="blockRegName" class="form-input" placeholder="مثلاً: رضا محمدی" maxlength="60" autocomplete="name" />
        </div>
        <div class="form-group">
          <label for="blockRegPhone">📱 شماره موبایل</label>
          <input type="tel" id="blockRegPhone" class="form-input" placeholder="۰۹۱۲۱۲۳۴۵۶۷" maxlength="11" dir="ltr" autocomplete="tel" inputmode="numeric" />
        </div>
        <div class="form-group">
          <label for="blockRegPassword">🔒 رمز عبور (حداقل ۶ کاراکتر)</label>
          <div class="show-pass-wrapper">
            <input type="password" id="blockRegPassword" class="form-input" placeholder="••••••••" style="padding-left: 40px;" autocomplete="new-password" />
            <button type="button" class="show-pass-btn" data-toggle-pass="blockRegPassword">👁️</button>
          </div>
        </div>
        <div class="form-group">
          <label for="blockRegPassword2">🔒 تکرار رمز عبور</label>
          <input type="password" id="blockRegPassword2" class="form-input" placeholder="••••••••" autocomplete="new-password" />
        </div>
        <div class="login-error-msg" id="blockRegError" style="margin:-4px 0 8px;"></div>
        <button class="login-submit-btn" id="btnBlockRegSubmit">📨 ارسال درخواست ثبت‌نام</button>
        <p class="login-footer-text">
          قبلاً ثبت‌نام کرده‌اید؟
          <a data-goto-block-tab="login">وارد شوید</a>
        </p>
      </div>

      <a class="login-back-link" href="login.html">→ ورود مدیر ساختمان</a>
    </div>
  </div>

  <div id="toastContainer" class="toast-container"></div>

  <script src="js/dialogs.js?v=1"></script>
  <script src="js/sync.js?v=6"></script>
  <script src="js/auth.js?v=5"></script>
  <script src="js/block-auth.js?v=1"></script>
</body>
</html>
